<html>
    <head>
        <title>JS Variable</title>
    </head>
    <body>
        <script>
            let greeting = 123;
            document.writeln(greeting + ' > ');
            document.writeln(typeof (greeting))
            document.writeln('</br>');

            let message;
            message = "123"
            document.writeln(message + ' > ');
            document.writeln(typeof (message))
            document.writeln('</br>');

        </script>
    </body>
</html>
